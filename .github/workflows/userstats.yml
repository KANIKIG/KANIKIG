name: Update GitHub statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "11 2 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate GitHub statistics card
        uses: cicirello/user-statistician@030eeb5a2efe592d05c29294cf82256f2fbe6371 # v1
        with:
          image-file: images/userstats.svg
          colors: dark-dimmed
          include-title: false
          commit-message: "chore(profile): refresh GitHub statistics"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
